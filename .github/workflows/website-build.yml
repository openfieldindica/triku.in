name: Build website artifact
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate website JavaScript and behavior tests
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(git ls-files -z '*.js' '*.mjs')
          mapfile -d '' tests < <(git ls-files -z '*.test.js' '*.test.mjs')
          if (( ${#tests[@]} )); then node --test "${tests[@]}"; fi
      - run: python3 scripts/package_site.py
        env:
          APP_SITE_ANDROID_SHA256_FINGERPRINTS: ${{ vars.APP_SITE_ANDROID_SHA256_FINGERPRINTS }}
          APP_SITE_STAGING_ANDROID_SHA256_FINGERPRINTS: ${{ vars.APP_SITE_STAGING_ANDROID_SHA256_FINGERPRINTS }}
          APP_SITE_APPLE_TEAM_ID: ${{ vars.APP_SITE_APPLE_TEAM_ID }}
          REQUIRE_APP_LINK_ASSOCIATIONS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-website
          path: output/website.zip
          if-no-files-found: error
          retention-days: 90
